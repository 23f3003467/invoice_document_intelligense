[project]
name = "smart-document-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.34.2",
    "fastapi==0.115.0",
    "openai>=3.19.2",
    "pdf2image==1.17.0",
    "pydantic==2.9.2",
    "pypdf==4.3.1",
    "pytesseract==0.3.13",
    "python-multipart==0.0.9",
    "uvicorn[standard]==0.30.6",
]

[project.scripts]
smart-document-intelligence = "smart_document_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
